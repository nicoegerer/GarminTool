name: Garmin-Daten aktualisieren

on:
  schedule:
    - cron: "15 */2 * * *"   # alle 2 Stunden
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Der rotierende Strava-Tokenstatus hat genau eine maßgebliche Branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Garmin-Connect-Token prüfen
        id: check
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: |
          python - <<'PY'
          import json, os
          try:
              tokens = json.loads(os.environ.get("GARMIN_TOKENS_JSON", ""))
              valid = isinstance(tokens, dict) and all(isinstance(tokens.get(k), str) and tokens[k].strip() for k in ("di_token", "di_refresh_token", "di_client_id"))
          except ValueError:
              valid = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"skip={'false' if valid else 'true'}\n")
          if not valid:
              print("::notice::Neue Garmin-Connect-Anmeldung erforderlich: setup_garmin_token.py ausführen und garmin_tokens.json als GARMIN_TOKENS_JSON speichern. Alte garth-Tokens sind nicht kompatibel. Siehe SETUP.md.")
          PY

      - name: uv installieren
        if: steps.check.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Garmin-Daten exportieren
        if: steps.check.outputs.skip == 'false'
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          GARMIN_STATE_DIR: .github/api-state
          DASHBOARD_DISPLAY_NAME: ${{ vars.DASHBOARD_DISPLAY_NAME }}
        run: uv run scripts/export_data.py

      - name: Aktivitätsdetails und FIT exportieren
        if: steps.check.outputs.skip == 'false'
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          GARMIN_STATE_DIR: .github/api-state
        run: uv run scripts/export_details.py

      - name: Strava-Namen im Dashboard übernehmen
        if: steps.check.outputs.skip == 'false'
        env:
          STRAVA_CONFIG_JSON: ${{ secrets.STRAVA_CONFIG_JSON }}
          STRAVA_STATE_DIR: .github/api-state
        # Namen ausschließlich in den Dashboard-Dateien ergänzen.
        continue-on-error: true
        run: |
          if [ -z "$STRAVA_CONFIG_JSON" ]; then
            echo "Kein STRAVA_CONFIG_JSON gesetzt – Namensabgleich übersprungen."
          else
            uv run scripts/sync_strava_names.py --execute
          fi

      - name: Änderungen committen
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          # Nur verschlüsselte .enc-Dateien, niemals lokale Schlüssel/Tokens.
          for state in .github/api-state/*.enc; do
            if [ -f "$state" ]; then
              git add -- "$state"
            fi
          done
          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
          else
            git commit -m "chore: Garmin-Daten aktualisiert ($(date -u +%F))"
            git push
          fi

      - name: Erneuerte Garmin-Tokens nach einem fehlgeschlagenen Export sichern
        if: failure() && steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for state in .github/api-state/garmin-*.enc; do
            if [ -f "$state" ]; then
              git add -- "$state"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: erneuerten Garmin-Tokenstatus sichern"
            git push
          fi
