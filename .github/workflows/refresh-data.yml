name: Garmin-Daten aktualisieren

on:
  schedule:
    - cron: "15 */2 * * *"   # alle 2 Stunden
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Der rotierende Strava-Tokenstatus hat genau eine maßgebliche Branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Personal-API-Schlüssel prüfen
        id: check
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: |
          if [ -z "$GARMIN_PERSONAL_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "GARMIN_PERSONAL_API_KEY fehlt. Bitte einen offiziellen Personal-API-Schlüssel als Repository-Secret hinterlegen (siehe SETUP.md)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: uv installieren
        if: steps.check.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Daten über Garmin Personal API exportieren
        if: steps.check.outputs.skip == 'false'
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: uv run scripts/export_data.py

      - name: Aktivitätsdetails über Personal API und FIT exportieren
        if: steps.check.outputs.skip == 'false'
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: uv run scripts/export_details.py

      - name: Strava-Namen im Dashboard übernehmen
        if: steps.check.outputs.skip == 'false'
        env:
          STRAVA_CONFIG_JSON: ${{ secrets.STRAVA_CONFIG_JSON }}
          STRAVA_STATE_DIR: .github/api-state
        # Die Garmin Personal API ist read-only. Namen werden deshalb nach
        # dem Export ausschließlich in den Dashboard-Dateien ergänzt.
        continue-on-error: true
        run: |
          if [ -z "$STRAVA_CONFIG_JSON" ]; then
            echo "Kein STRAVA_CONFIG_JSON gesetzt – Namensabgleich übersprungen."
          else
            uv run scripts/sync_strava_names.py --execute
          fi

      - name: Änderungen committen
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          # Nur verschlüsselte .enc-Dateien, niemals lokale Schlüssel/Tokens.
          for state in .github/api-state/*.enc; do
            if [ -f "$state" ]; then
              git add -- "$state"
            fi
          done
          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
          else
            git commit -m "chore: Garmin-Daten aktualisiert ($(date -u +%F))"
            git push
          fi
