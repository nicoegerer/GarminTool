name: Offizielle API-Anbindungen testen

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "app/**"
      - ".github/workflows/test-apis.yml"
      - ".github/workflows/refresh-data.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "app/**"
      - ".github/workflows/test-apis.yml"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run tests/test_api_integration.py

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: app
        run: npm ci
      - name: Anzeigenamen und Datenstand prüfen
        working-directory: app
        run: npm test
      - name: Frontend-Typen prüfen
        working-directory: app
        run: npm run typecheck
